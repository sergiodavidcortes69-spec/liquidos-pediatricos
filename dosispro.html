<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galenio · DosisPro</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;color:#163B65;margin:0}main{max-width:820px;margin:auto;padding:24px}.card{border:1px solid #D9E7EE;border-radius:12px;padding:18px;margin-top:16px}input,select,button{font:inherit;padding:12px;border:1px solid #D9E7EE;border-radius:12px;color:#163B65;background:white}input[type=number],input[type=search],select{width:100%;margin:8px 0 16px}.tabs{display:flex;gap:10px;margin:16px 0}.tabs button{flex:1;cursor:pointer}.tabs button[aria-pressed=true]{background:#EAF5FA;font-weight:600}.warn{padding:14px;background:#fff6dd;border-left:4px solid #b67800;margin:14px 0}.out{padding:14px;background:#EAF5FA;border-radius:12px}label{display:block}[hidden]{display:none!important}small{color:#40566E}ul.res{list-style:none;margin:0;padding:0}ul.res li button{display:block;width:100%;text-align:left;margin:8px 0;cursor:pointer}ul.res li button small{display:block}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips button{cursor:pointer;padding:8px 14px;border-radius:20px}.back{cursor:pointer;margin:16px 0 0}h3{margin:20px 0 4px}.ref{display:block;margin-top:12px}</style></head><body><main>
<a href="./">Volver a Galenio</a><h1>Galenio · DosisPro</h1>
<div class="warn">Requiere validación clínica; no genera orden de administración automática.</div>
<div id="vsearch"><label for="q">Buscar medicamento</label><input id="q" type="search" placeholder="Escriba el nombre, el grupo o la indicación" autocomplete="off" autocapitalize="off"><div id="status" role="status" aria-live="polite"></div><ul class="res" id="res"></ul><div id="rel"></div></div>
<div id="vmed" hidden><button type="button" class="back" id="back">← Buscar otro medicamento</button><div class="card"><h2 id="mt"></h2><div class="tabs"><button type="button" id="tp" aria-pressed="true">Pediatría</button><button type="button" id="ta" aria-pressed="false">Adultos</button></div><section id="sp"><div id="form"></div><div class="out" id="out" role="status" aria-live="polite"></div><small class="ref" id="refp"></small></section><section id="sa" hidden></section><div id="info"></div><div id="mrel"></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id),F=(x,d=2)=>x.toLocaleString('es-CO',{maximumFractionDigits:d});
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const PED='PEDIADOSIS®. Dosis de medicamentos en pediatría. Velásquez O.J. Health Book’s Editorial.';
const MT='Manual de Terapéutica, Fundamentos de Medicina, 18.ª ed. 2018–2019. González M.A., Lopera W.D., Arango A.I.';
function computeV(w,a,s,d,n,c,risk){if(!(w>0)||!Number.isFinite(a)||a<0||!(d>0))return {error:'Complete peso, edad y dosis prescrita.'};if(risk)return {error:'No generar plan: condición de riesgo o contraindicación. Requiere valoración especializada.'};const ranges={inicio:[10,15],mantenimiento:[30,60],carga:[20,40]},r=ranges[s];if(!r||d<r[0]||d>r[1])return {error:'Dosis fuera del rango del esquema seleccionado.'};if(s==='carga')return {load:true,mg:w*d};return {daily:w*d,mg:w*d/n,ml:w*d/n/c,n:n}}
function calcValp(v){const r=computeV(v.w,v.age,v.s,v.d,Number(v.n),Number(v.c),v.risk);if(r.error)return {error:r.error};const warn=v.age<2?['Menor de 2 años: alto riesgo de hepatotoxicidad. Confirmar valoración especializada.']:[],l=[];if(r.load){l.push('Carga calculada: '+F(r.mg,3)+' mg IV.');l.push('No utilizar el frasco oral para vía IV. Confirmar dilución, máximo institucional y velocidad con monitorización antes de administrar. No se emite orden IV automática.')}else{l.push('Total diario: '+F(r.daily,3)+' mg/día.');l.push('Por toma: '+F(r.mg,3)+' mg cada '+24/r.n+' horas.');l.push('Volumen exacto sin redondear: '+F(r.ml,3)+' mL por toma.');l.push('Verificar volumen medible y prescripción. No triturar formas de liberación prolongada.');if(v.s==='inicio')l.push('Titulación de referencia: incrementos semanales de 5–10 mg/kg/día según control y tolerancia; no automática.')}return {warn:warn,lines:l}}
function calcZinc(v){if(!Number.isFinite(v.m)||v.m<0)return {error:'Ingrese la edad en meses.'};const ml=v.m<=6?2.5:5,mg=ml*2;return {lines:['Administrar '+F(ml,3)+' mL ('+F(mg,3)+' mg de zinc elemental) vía oral cada 12 horas por 14 días.','Total diario: '+F(mg*2,3)+' mg de zinc elemental.']}}
const need=w=>!(w>0)?{error:'Ingrese el peso.'}:null;
const R={
salbutamol:v=>need(v.w)||(()=>{const mg=Math.min(Math.max(0.15*v.w,1.25),2.5);return {lines:['Nebulizar '+F(mg)+' mg ('+F(mg/5)+' mL de solución 5 mg/mL) diluidos en 2–3 mL de SSN cada 6 horas.','Regla: 0,15 mg/kg; mínimo 1,25 mg y máximo 2,5 mg.']}})(),
ipratropio:v=>need(v.w)||{lines:['Nebulizar 0,2 mg ('+F(0.2/0.25)+' mL de solución 0,25 mg/mL) cada 6 horas.','Dosis fija, independiente del peso.']},
prednisona:v=>need(v.w)||(()=>{const d=2*v.w,w=['PENDIENTE DE VERIFICAR: sin máximo diario definido en la fuente.'];if(d>60)w.push('ALERTA: supera 60 mg/día (rango de adultos del Manual de Terapéutica). Verificar.');return {warn:w,lines:['Total diario: '+F(d)+' mg/día en 1 toma (2 mg/kg/día).']}})(),
hidrocortisona:v=>need(v.w)||(()=>{const d=10*v.w;return {lines:['Inicial: '+F(d)+' mg IV ('+F(d/50)+' mL de 50 mg/mL, ampolla 100 mg/2 mL).','Luego: '+F(d)+' mg IV cada 6 horas.','Regla: 10 mg/kg. Sin máximo definido en la fuente: verificar.']}})(),
metilprednisolona:v=>need(v.w)||(()=>{const d=2*v.w;return {lines:['Inicial: '+F(d)+' mg IV.','Luego: '+F(d)+' mg cada 8 horas.','Regla: 2 mg/kg. Sin máximo definido en la fuente: verificar.']}})(),
dexametasona:v=>need(v.w)||(()=>{const mg=Math.min(0.15*v.w,5);return {lines:['Dosis única: '+F(mg)+' mg ('+F(mg/4)+' mL de ampolla 4 mg/mL).','Regla: 0,15 mg/kg; máximo 5 mg. La fuente no indica la indicación (crup o asma): confirmar.']}})(),
adrenalina:v=>need(v.w)||(()=>{const mg=Math.min(0.01*v.w,0.3);return {lines:['Dosis única SC: '+F(mg)+' mg ('+F(mg)+' mL de solución 1 mg/mL).','Regla: 0,01 mg/kg; máximo 0,3 mg.']}})(),
teofilina:v=>need(v.w)||(()=>{const d=16*v.w;return {lines:['Total diario: '+F(d)+' mg/día.','Por toma: '+F(d/2)+' mg cada 12 horas (2 tomas).','Regla: 16 mg/kg/día. Idealmente con niveles plasmáticos.']}})(),
aminofilina:v=>need(v.w)||(()=>{const a=v.age;if(!Number.isFinite(a)||a<0.5)return {error:'Requiere edad de 6 meses o más.'};if(a>16)return {error:'Mayor de 16 años: usar la pestaña de adultos.'};const r=a<10?1:0.8,c=Math.min(5*v.w,250);return {lines:['Carga: '+F(c)+' mg IV (5 mg/kg; máximo 250 mg).','Mantenimiento: '+F(r*v.w)+' mg/hora ('+F(r)+' mg/kg/h para '+(a<10?'6 meses–9 años':'10–16 años')+').','Confirmar dilución y velocidad con monitorización. No se emite orden IV automática.']}})()};
const W={id:'w',label:'Peso medido (kg)',type:'number'},A={id:'age',label:'Edad (años; admite decimales)',type:'number'};
const RESP='Respiratorio',RP=PED+' Tabla de dosis pediátricas aportada.';
const MEDS=[
{id:'valproico',n:'Ácido valproico',grp:'Neurología',alias:'valproato depakene depakine epilepsia convulsion anticonvulsivante estatus',rel:['zinc'],
 fields:[W,A,{id:'s',label:'Esquema',type:'select',opts:[['inicio','Inicio oral: 10–15 mg/kg/día'],['mantenimiento','Mantenimiento oral: 30–60 mg/kg/día'],['carga','Carga IV en estatus: 20–40 mg/kg/dosis']],reset:['d']},{id:'d',label:v=>v.s==='carga'?'Dosis prescrita (mg/kg/dosis)':'Dosis prescrita (mg/kg/día)',type:'number',ph:'No se asigna el máximo automáticamente'},{id:'n',label:'Tomas al día',type:'select',opts:[['2','2: cada 12 horas'],['3','3: cada 8 horas']],show:v=>v.s!=='carga'},{id:'c',label:'Concentración oral: verificar envase',type:'select',opts:[['50','250 mg/5 mL (50 mg/mL)'],['40','200 mg/5 mL (40 mg/mL)']],show:v=>v.s!=='carga'},{id:'risk',label:'Hepatopatía, enfermedad pancreática grave, trastorno del ciclo de la urea o POLG conocido/sospechado',type:'check'}],
 calc:calcValp,refP:'AEP · Pediamécum · Ácido valproico. Concentraciones orales de documentos aportados: confirmar etiqueta.',
 adult:'Referencia de adultos pendiente de completar y validar. No se extrapola automáticamente por un umbral de peso. No iniciar automáticamente en 60 mg/kg/día. Verificar indicación, titulación, interacciones y condiciones del paciente.',refA:MT+' Capítulo Neurología (pendiente de completar).',
 info:'<p>Contraindicado en hepatitis aguda/crónica, disfunción hepática o pancreática grave, porfiria hepática, trastornos del ciclo de la urea y determinadas enfermedades mitocondriales POLG. Mayor riesgo de hepatotoxicidad en menores de 2 años.</p><p>Revisar hemograma, coagulación y función hepática. Vigilar pancreatitis, hiperamoniemia y trombocitopenia. Revisar interacciones con carbapenémicos y otros antiepilépticos. En niñas y mujeres con capacidad de gestación requiere valoración especializada y prevención del embarazo.</p><p>Fuente: <a href="https://www.aeped.es/comites/cm/pediamecum/principios-activos/acido-valproico">AEP · Pediamécum · Ácido valproico</a>.</p>'},
{id:'zinc',n:'Zinc (diarrea aguda)',grp:'Gastrointestinal',alias:'sulfato de zinc sulzinc ziped zinkids diarrea',rel:[],
 fields:[{id:'m',label:'Edad (meses)',type:'number'}],calc:calcZinc,refP:PED+' pp. 394–395.',
 adult:'Pauta de diarrea definida solo para pediatría. Referencia de adultos pendiente de completar y validar.',refA:MT+' (pendiente de completar).',
 info:'<p>Presentación: solución oral de zinc elemental 2 mg/mL, frasco de 80 mL (SulZinc, Ziped, ZinKids). Confirmar concentración en la etiqueta del producto disponible.</p><p>Duración de 10–14 días en la fuente; este módulo usa 14 días.</p>'},
{id:'salbutamol',n:'Salbutamol',grp:RESP,alias:'albuterol ventolin asma broncoespasmo broncodilatador nebulizacion epoc',rel:['ipratropio','prednisona','teofilina','aminofilina'],fields:[W],calc:R.salbutamol,refP:RP,adult:'Nebulizado: 2,5–5 mg en 2–3 mL de SSN cada 4–8 h. IDM 100 µg: 2 inhalaciones cada 4–6 h (máximo 12/día). Oral: 2–4 mg, 3–4 veces al día (máximo 32 mg/día). Crisis asmática: IDM con aerocámara, 2 inhalaciones cada 20 min por 3 dosis; o nebulizado 10 mg/hora, espaciando según respuesta.',refA:MT+' Capítulo 18, Neumología, pp. 570–571, 579.'},
{id:'ipratropio',n:'Bromuro de ipratropio',grp:RESP,alias:'atrovent asma epoc nebulizacion anticolinergico',rel:['salbutamol','teofilina'],fields:[W],calc:R.ipratropio,refP:RP,adult:'Nebulizado: 0,25–0,5 mg cada 6 h. IDM 20 µg: 2–3 inhalaciones cada 6 h.',refA:MT+' Capítulo 18, Neumología, p. 572.'},
{id:'prednisona',n:'Prednisona',grp:RESP,alias:'corticoide esteroide asma crisis',rel:['metilprednisolona','hidrocortisona','dexametasona','salbutamol'],fields:[W],calc:R.prednisona,refP:RP,adult:'40–60 mg/día. En crisis asmática se suspende al mejorar o a los 7 días, salvo uso crónico previo.',refA:MT+' Capítulo 18, Neumología, p. 580.'},
{id:'hidrocortisona',n:'Hidrocortisona',grp:RESP,alias:'corticoide esteroide asma crisis solu-cortef',rel:['metilprednisolona','prednisona','dexametasona','salbutamol'],fields:[W],calc:R.hidrocortisona,refP:RP,adult:'100–200 mg IV cada 4 h (ampolla 100 mg).',refA:MT+' Capítulo 18, Neumología, p. 580.'},
{id:'metilprednisolona',n:'Metilprednisolona',grp:RESP,alias:'corticoide esteroide asma crisis',rel:['prednisona','hidrocortisona','dexametasona','salbutamol'],fields:[W],calc:R.metilprednisolona,refP:RP,adult:'40–60 mg cada 6 h, VO o sistémica.',refA:MT+' Capítulo 18, Neumología, p. 580.'},
{id:'dexametasona',n:'Dexametasona',grp:RESP,alias:'corticoide esteroide asma crup',rel:['prednisona','hidrocortisona','metilprednisolona','salbutamol'],fields:[W],calc:R.dexametasona,refP:RP,adult:'0,5–24 mg (máximo 40 mg) una vez al día; en asma, 1–2 días suelen bastar. Reducción gradual si supera 10 días.',refA:'Guías de práctica clínica MSF, dexametasona oral (no figura en el Manual de Terapéutica aportado).'},
{id:'adrenalina',n:'Adrenalina',grp:RESP,alias:'epinefrina anafilaxia broncoespasmo',rel:['salbutamol','hidrocortisona','dexametasona'],fields:[W],calc:R.adrenalina,refP:RP,adult:'IM (vía preferida): 0,01 mg/kg; habitual 0,3–0,5 mg (0,3–0,5 mL de 1 mg/mL), máximo 0,5 mg por dosis, en el muslo; repetir cada 5–15 min si no mejora.',refA:'Ficha técnica AEMPS (adrenalina 1 mg/mL); guía SEAIC; GALAXIA 2016 (no figura en el Manual de Terapéutica aportado).'},
{id:'teofilina',n:'Teofilina',grp:RESP,alias:'xantina asma epoc',rel:['aminofilina','salbutamol','ipratropio'],fields:[W],calc:R.teofilina,refP:RP,adult:'12–16 mg/kg/día en 2 tomas (liberación sostenida), máximo 400 mg/día por 3 días; luego 18–22 mg/kg/día, máximo 800 mg. Reducir a la mitad si es mayor de 60 años, ICC o daño hepático. Nivel ideal 8–15 µg/mL; medir niveles.',refA:MT+' Capítulo 18, Neumología, pp. 574–575.'},
{id:'aminofilina',n:'Aminofilina IV',grp:RESP,alias:'xantina asma epoc crisis',rel:['teofilina','salbutamol','ipratropio'],fields:[W,A],calc:R.aminofilina,refP:RP,adult:'Carga 5–6 mg/kg IV en 20–30 min (velocidad máxima 25 mg/min). Mantenimiento 0,4–0,9 mg/kg/h; reducir en ancianos, cardiópatas o hepatópatas. Nivel ideal de teofilina 8–15 µg/mL.',refA:'Facultad de Medicina UNAM (aminofilina) y Vademécum; nivel de teofilina según '+MT+' Capítulo 18, p. 575. Verificar contra ficha local.'}
];
const byId=id=>MEDS.find(m=>m.id===id);
function search(t){t=norm(t).trim();if(!t)return [];const sc=m=>{const n=norm(m.n),al=norm(m.alias),g=norm(m.grp);return n.startsWith(t)?0:n.includes(t)?1:al.split(' ').some(x=>x.startsWith(t))?2:(al.includes(t)||g.includes(t))?3:9};return MEDS.map(m=>[sc(m),m]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n,'es')).map(x=>x[1])}
function relatedOf(list){if(!list.length)return [];const seen=new Set(list.map(m=>m.id)),out=[];list[0].rel.concat(MEDS.filter(m=>m.grp===list[0].grp).map(m=>m.id)).forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(byId(id))}});return out.slice(0,5)}
function chips(arr){return arr.map(m=>'<button type="button" data-open="'+m.id+'">'+m.n+'</button>').join('')}
let cur=null,last='';
function renderSearch(){const t=$('q').value,l=search(t),res=$('res'),st=$('status'),rel=$('rel');res.innerHTML='';rel.innerHTML='';if(!t.trim()){st.textContent='';return}
 if(!l.length){st.textContent='Sin resultados.';return}
 st.textContent=l.length+(l.length===1?' resultado':' resultados');
 l.forEach(m=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.setAttribute('data-open',m.id);b.innerHTML='<b></b><small></small>';b.firstChild.textContent=m.n;b.lastChild.textContent=m.grp;li.appendChild(b);res.appendChild(li)});
 const r=relatedOf(l);if(r.length)rel.innerHTML='<h3>Relacionados</h3><div class="chips">'+chips(r)+'</div>'}
function vals(){const v={};cur.fields.forEach(f=>{const e=$('f_'+f.id);if(!e)return;v[f.id]=f.type==='check'?e.checked:f.type==='select'?e.value:(e.value===''?NaN:Number(e.value))});return v}
function drawForm(keep){const m=cur,old=keep?vals():{};if(!keep&&last)old.w=Number(last);const cv={};m.fields.forEach(f=>{cv[f.id]=old[f.id]!==undefined?old[f.id]:(f.type==='select'?f.opts[0][0]:f.type==='check'?false:NaN)});
 let h='';m.fields.forEach(f=>{if(f.show&&!f.show(cv))return;const lab=typeof f.label==='function'?f.label(cv):f.label;
  if(f.type==='check')h+='<label><input id="f_'+f.id+'" type="checkbox" style="width:auto"'+(cv[f.id]?' checked':'')+'> '+lab+'</label>';
  else if(f.type==='select')h+='<label for="f_'+f.id+'">'+lab+'</label><select id="f_'+f.id+'">'+f.opts.map(o=>'<option value="'+o[0]+'"'+(String(cv[f.id])===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  else h+='<label for="f_'+f.id+'">'+lab+'</label><input id="f_'+f.id+'" type="number" min="0" step="any" inputmode="decimal"'+(f.ph?' placeholder="'+f.ph+'"':'')+(Number.isFinite(cv[f.id])?' value="'+cv[f.id]+'"':'')+'>'});
 $('form').innerHTML=h;calcOut()}
function calcOut(){const m=cur,v=vals();if(Number.isFinite(v.w))last=String(v.w);const r=m.calc(v),o=$('out');
 if(r.error){o.textContent=r.error;return}o.innerHTML='';(r.warn||[]).forEach(w=>{const d=document.createElement('div');d.className='warn';d.textContent=w;o.appendChild(d)});(r.lines||[]).forEach(x=>{const p=document.createElement('p');p.textContent=x;o.appendChild(p)})}
function tab(p){$('sp').hidden=!p;$('sa').hidden=p;$('tp').setAttribute('aria-pressed',p);$('ta').setAttribute('aria-pressed',!p)}
function openMed(id){cur=byId(id);if(!cur)return;$('vsearch').hidden=true;$('vmed').hidden=false;$('mt').textContent=cur.n;
 $('sa').innerHTML='<p></p><small class="ref"></small>';$('sa').firstChild.textContent=cur.adult;$('sa').lastChild.textContent='Referencia: '+cur.refA+' Requiere validación clínica.';
 $('refp').textContent='Referencia: '+cur.refP;
 $('info').innerHTML=cur.info?'<details open><summary>Seguridad y fuentes</summary>'+cur.info+'</details>':'';
 const r=cur.rel.map(byId).filter(Boolean);$('mrel').innerHTML=r.length?'<h3>Relacionados</h3><div class="chips">'+chips(r)+'</div>':'';
 tab(true);drawForm(false);window.scrollTo(0,0)}
function closeMed(){cur=null;$('vmed').hidden=true;$('vsearch').hidden=false;renderSearch();$('q').focus()}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){openMed(o.getAttribute('data-open'))}});
$('q').addEventListener('input',renderSearch);
$('back').addEventListener('click',closeMed);$('tp').addEventListener('click',()=>tab(true));$('ta').addEventListener('click',()=>tab(false));
$('form').addEventListener('input',e=>{if(e.target.type==='number'||e.target.type==='checkbox')calcOut()});
$('form').addEventListener('change',e=>{const f=cur.fields.find(x=>'f_'+x.id===e.target.id);if(f&&f.type==='select'){if(f.reset)f.reset.forEach(i=>{const el=$('f_'+i);if(el)el.value=''});drawForm(true)}else if(f&&f.type==='check')calcOut()});
</script></body></html>
